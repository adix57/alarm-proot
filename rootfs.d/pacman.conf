#
# /etc/pacman.conf tuned for rootless proot (used by the builder AND baked
# into the image).
#
# Off in proot: CheckSpace (proot bind mounts make statfs() meaningless) and
# DownloadUser (pacman 7+ downloads via setuid — impossible without real root).

[options]
HoldPkg     = pacman glibc
Architecture = aarch64
#CheckSpace
ParallelDownloads = 8
#DownloadUser = alpm
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# mirror.archlinuxarm.org geo-redirects, so one Server line works everywhere;
# add regional mirrors (https://<region>.mirror.archlinuxarm.org/$arch/$repo)
[core]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[extra]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[alarm]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[aur]
Server = http://mirror.archlinuxarm.org/$arch/$repo
